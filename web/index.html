<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gitva</title>
    <link rel="icon" href="/favicon.png" />
    <style>
      /*
        One spacing unit, everything a multiple of it; one corner radius.
        Three surface levels — ground, panel, raised — rather than borders
        doing work a background step should do. Monospace is for machine text
        only: shas, paths, modes, object contents.
      */
      :root {
        --u: 8px;
        --r: 4px;
        --ground: #0d0f13;
        --panel: #171a21;
        --raised: #20242e;
        --line: #2c313d;
        --ink: #dfe4ee;
        --muted: #8d96a8;
        --faint: #59616f;
        --commit: #e8a33c;
        --tree: #54bf85;
        --blob: #5aa7ea;
        --staged: #8f86e6;
        --accent: #ff5ea8;
        --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--ground);
        color: var(--ink);
        font: 13px/1.5 var(--sans);
        display: grid;
        /* header, recording toolbar, notes, then the canvas takes the rest. One
           `auto` per toolbar: add or drop a row here and this must follow. */
        grid-template-rows: auto auto auto 1fr;
        overflow: hidden;
      }
      kbd, code, .mono { font-family: var(--mono); }

      /* Chrome: grouped, separated controls — what repo, what you're looking
         at, what state it's in. Not a flat run of unrelated buttons. */
      header {
        display: flex; align-items: center; gap: calc(var(--u) * 2);
        padding: var(--u) calc(var(--u) * 1.5);
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .group { display: flex; align-items: center; gap: var(--u); }
      .group + .group { padding-left: calc(var(--u) * 2); border-left: 1px solid var(--line); }
      .group.right { margin-left: auto; }
      .repo-name { font-weight: 600; }
      /* The identifier the recording is filed under — machine text, so mono,
         and a click copies it the way a click on a shape copies a sha. */
      .recording-id { color: var(--faint); font-family: var(--mono); font-size: 11px; cursor: pointer; }
      .recording-id:hover { color: var(--muted); }
      /* Chrome, not canvas: red here is a warning about a button, and joins
         neither the three object hues nor the one accent. */
      .danger { color: #f2685e; }

      button, select, input {
        font: inherit; color: var(--ink);
        background: var(--raised);
        border: 1px solid var(--line); border-radius: var(--r);
        padding: 3px var(--u);
      }
      button { cursor: pointer; }
      button:not(:disabled):hover, button[aria-pressed='true'] { background: #2b3140; }
      button[aria-pressed='true'] { border-color: var(--muted); }
      /* A control whose subject is off screen: still readable, still shows
         whether it is pressed, but there is nothing for it to act on. */
      button:disabled { opacity: 0.45; cursor: default; }
      input[type='range'] { padding: 0; background: none; border: none; width: 140px; }

      .live { display: flex; align-items: center; gap: 6px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tree); }
      .dot.off { background: transparent; border: 1px solid var(--muted); }
      .dot.paused { background: var(--commit); }
      .tally { color: var(--muted); font-family: var(--mono); font-size: 11px; }
      /* Reserve the widest label: the buttons must not move when the words change. */
      #play { min-width: 5.5em; }
      #tape-pos { min-width: 5ch; }
      .change { color: var(--muted); font-family: var(--mono); font-size: 11px; min-width: 8ch; }

      /* The recording rides on its own row: the toolbar above it resizes as the
         state changes, and a button that moves is a button you miss. `reset view`
         sits at its left rather than on a row of its own — one button did not
         earn a whole row, and it is still the leftmost thing on the row. */
      #transport {
        display: flex; align-items: center; gap: calc(var(--u) * 2);
        padding: 6px calc(var(--u) * 1.5);
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      #notes {
        padding: 6px calc(var(--u) * 1.5);
        background: var(--ground);
        border-bottom: 1px solid var(--line);
        color: var(--muted); font-size: 12px;
        display: flex; flex-wrap: wrap; gap: calc(var(--u) * 2);
      }
      #notes li { list-style: none; }
      #notes ul { display: contents; margin: 0; padding: 0; }

      main { display: grid; grid-template-columns: 1fr auto auto; min-height: 0; }
      #graph { display: block; width: 100%; height: 100%; cursor: grab; }
      #copied {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
        background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
        padding: 4px calc(var(--u) * 1.5); font-family: var(--mono); font-size: 12px;
        color: var(--muted); opacity: 0; transition: opacity .15s; pointer-events: none;
      }
      #copied.show { opacity: 1; }
      #graph.dragging { cursor: grabbing; }

      /* The details panel is where the teaching lives, so it earns width —
         and how much is yours to drag, the way a canvas band's width is. */
      #panel-seam { width: 5px; cursor: col-resize; background: var(--line); }
      aside {
        width: 430px; background: var(--panel);
        overflow-y: auto; scroll-behavior: smooth; padding: calc(var(--u) * 2);
        display: flex; flex-direction: column; gap: calc(var(--u) * 1.5);
      }
      aside h2 { margin: 0; font-size: 15px; }
      aside .what { margin: 0; color: var(--muted); }
      aside .made {
        background: var(--raised); border-radius: var(--r);
        padding: var(--u); font-family: var(--mono); font-size: 12px; color: var(--tree);
        overflow-x: auto;
      }
      aside dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--u); margin: 0; }
      aside dt { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      aside dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
      /* The sha is the key to the store, and a click hands it over — so it is
         drawn as the one field you can take, not as another fact. */
      aside dd.sha {
        background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
        padding: 2px 6px; margin: -2px 0; cursor: pointer;
      }
      aside dd.sha:hover { border-color: var(--muted); }
      aside pre {
        background: var(--raised); border-radius: var(--r); padding: var(--u);
        margin: 0; max-height: 40vh; overflow: auto; font-size: 12px;
      }
      aside pre.unreadable { font-weight: 700; }
      aside .empty { color: var(--faint); }

      /* `body` is a grid, so a dialog left to flow would be placed in a row
         rather than in the middle of the window: fixed and auto-margined puts
         it back on the screen's centre. No scroll — it has to fit. */
      dialog {
        position: fixed; inset: 0; margin: auto;
        width: fit-content; height: fit-content; max-width: 560px;
        background: var(--panel); color: var(--ink);
        border: 1px solid var(--line); border-radius: var(--r);
        padding: calc(var(--u) * 2);
      }
      dialog::backdrop { background: rgba(0, 0, 0, .6); }
      dialog label { display: block; margin-bottom: var(--u); }
      dialog h2 { font-size: 13px; margin: calc(var(--u) * 2) 0 var(--u); }
      dialog h2:first-child { margin-top: 0; }
      dialog .lede { color: var(--muted); margin: 0 0 var(--u); }
      dialog footer { margin-top: calc(var(--u) * 2); display: flex; align-items: center; gap: var(--u); }
      dialog footer a { color: var(--muted); margin-left: auto; }
      /* The kinds read as one row of samples: the swatch and the word are the
         legend, and a description each would cost more height than it teaches. */
      .legend { display: flex; flex-wrap: wrap; gap: 6px calc(var(--u) * 1.5); align-items: center; }
      .legend > span { display: flex; align-items: center; gap: 6px; }
      /* A key is machine text and gets <kbd>; what it does is not. */
      .keys { display: grid; grid-template-columns: max-content 1fr; gap: 6px calc(var(--u) * 1.5); align-items: baseline; }
      .keys > :nth-child(odd) { color: var(--muted); }
      .swatch { width: 16px; height: 16px; flex: none; }
      .swatch.commit { border-radius: 50%; background: var(--commit); }
      .swatch.tree { background: var(--tree); clip-path: polygon(30% 0, 100% 0, 100% 100%, 30% 100%, 0 70%, 0 30%); }
      .swatch.blob { border-radius: 8px; background: var(--blob); }
      .swatch.staged { border-radius: 8px; background: var(--staged); }
      .swatch.ref { border: 1px solid var(--muted); border-radius: var(--r); }
      .swatch.tag { border: 1px solid var(--muted); clip-path: polygon(0 50%, 35% 0, 100% 0, 100% 100%, 35% 100%); }
      .swatch.index { border: 1px dashed var(--muted); border-radius: var(--r); }
      .swatch.ghost { border: 1px dashed var(--faint); border-radius: 8px; }
      .swatch.changed { box-shadow: 0 0 0 2px var(--accent); border-radius: var(--r); }
    </style>
  </head>
  <body>
    <!--
      Not a word of copy lives in here. Every visible string is keyed:
      `data-t` sets the text, `data-t-title` the tooltip, `data-t-placeholder`
      the placeholder, and `data-t-html` the text of the handful that carry a
      <kbd> inside them. The words themselves are in `src/strings-en.ts`, and
      `app.ts` fills them in on load.
    -->
    <header>
      <div class="group">
        <span class="repo-name" id="repo-name">…</span>
        <span class="recording-id" id="recording-id" data-t-title="recording-id.title"></span>
      </div>

      <div class="group">
        <select id="question" data-t-title="question.title">
          <option value="all" data-t="question.all"></option>
          <option value="branches" data-t="question.branches"></option>
          <option value="message" data-t="question.message"></option>
          <option value="author" data-t="question.author"></option>
          <option value="path" data-t="question.path"></option>
          <option value="content" data-t="question.content"></option>
        </select>
        <input id="search" data-t-placeholder="search.placeholder" size="14" hidden />
        <select id="branches" multiple size="1" hidden></select>
        <button id="load-all" data-t="load-all" data-t-title="load-all.title" hidden></button>
        <button id="unfold" data-t="expand-all" data-t-title="expand-all.title"></button>
        <button id="fold" data-t="collapse-all" data-t-title="collapse-all.title"></button>
        <button id="toggle-index" aria-pressed="true" data-t="index" data-t-title="index.title"></button>
        <button
          id="toggle-orphans"
          aria-pressed="true"
          data-t="unreachable"
          data-t-title="unreachable.title"
        ></button>
        <button
          id="toggle-cross"
          aria-pressed="false"
          data-t="cross-links"
          data-t-title="cross-links.title"
        ></button>
        <button
          id="toggle-names"
          aria-pressed="true"
          data-t="names"
          data-t-title="names.title"
        ></button>
      </div>

      <div class="group right">
        <button id="legend-btn" data-t="help"></button>
        <button id="settings-btn" data-t="settings"></button>
      </div>

      <!-- One button per language on offer, rendered from the registry in
           src/strings.ts: a language names itself, so no copy in here. -->
      <div class="group" id="languages"></div>
    </header>

    <div id="transport">
      <div class="group">
        <button id="unpin" data-t="reset-view" data-t-title="reset-view.title"></button>
      </div>
      <div class="group">
        <button id="step-back" data-t-title="step-back.title">◀</button>
        <button id="play" aria-pressed="false" data-t-title="pause.title"></button>
        <button id="step-fwd" data-t-title="step-forward.title">▶</button>
        <input type="range" id="scrub" min="0" max="0" value="0" />
        <span class="tally" id="tape-pos"></span>
      </div>
      <div class="group right">
        <span class="live"><span class="dot" id="live-dot"></span><span id="live-text"></span></span>
        <span class="tally" id="tally"></span>
        <span class="change" id="change"></span>
      </div>
    </div>

    <div id="notes"><ul id="notes-list"></ul></div>

    <main>
      <canvas id="graph"></canvas>
      <div id="copied" aria-live="polite"></div>
      <div id="panel-seam"></div>
      <!-- The empty state is the inspector's own words; app.ts renders it on load. -->
      <aside id="panel"></aside>
    </main>

    <dialog id="legend">
      <h2 data-t="help.title"></h2>
      <p class="lede" data-t="help.lede"></p>
      <div class="legend">
        <span><span class="swatch commit"></span><span data-t="help.legend.commit"></span></span>
        <span><span class="swatch tree"></span><span data-t="help.legend.tree"></span></span>
        <span><span class="swatch blob"></span><span data-t="help.legend.blob"></span></span>
        <span><span class="swatch staged"></span><span data-t="help.legend.staged"></span></span>
        <span><span class="swatch ref"></span><span data-t="help.legend.ref"></span></span>
        <span><span class="swatch tag"></span><span data-t="help.legend.tag"></span></span>
        <span><span class="swatch index"></span><span data-t="help.legend.index"></span></span>
        <span><span class="swatch ghost"></span><span data-t="help.legend.unreachable"></span></span>
        <span><span class="swatch changed"></span><span data-t="help.legend.changed"></span></span>
      </div>
      <h2 data-t="help.keyboard"></h2>
      <div class="keys">
        <span data-t="help.keys.wheel"></span><span data-t-html="help.keys.wheel.does"></span>
        <span data-t="help.keys.dragBackground"></span><span data-t="help.keys.dragBackground.does"></span>
        <span data-t="help.keys.doubleBackground"></span><span data-t="help.keys.doubleBackground.does"></span>
        <span data-t="help.keys.click"></span><span data-t="help.keys.click.does"></span>
        <span data-t="help.keys.rightClick"></span><span data-t="help.keys.rightClick.does"></span>
        <span data-t="help.keys.doubleCommit"></span><span data-t="help.keys.doubleCommit.does"></span>
        <span data-t="help.keys.doubleTree"></span><span data-t="help.keys.doubleTree.does"></span>
        <span data-t="help.keys.drag"></span><span data-t="help.keys.drag.does"></span>
        <span data-t="help.keys.shiftClick"></span><span data-t="help.keys.shiftClick.does"></span>
        <span data-t="help.keys.seam"></span><span data-t="help.keys.seam.does"></span>
        <span><kbd>f</kbd></span><span data-t="help.keys.fit.does"></span>
        <span><kbd>i</kbd></span><span data-t="help.keys.index.does"></span>
        <span><kbd>&larr;</kbd> or <kbd>[</kbd></span><span data-t="help.keys.back.does"></span>
        <span><kbd>&rarr;</kbd> or <kbd>]</kbd></span><span data-t="help.keys.forward.does"></span>
        <span><kbd>space</kbd></span><span data-t="help.keys.space.does"></span>
      </div>
      <footer>
        <button data-t="close" onclick="this.closest('dialog').close()"></button>
        <a href="https://github.com/ewancoder/gitva" target="_blank" rel="noreferrer">github.com/ewancoder/gitva</a>
      </footer>
    </dialog>

    <dialog id="settings">
      <h2 data-t="settings.title"></h2>
      <p class="lede" data-t="settings.lede"></p>
      <label><input type="checkbox" id="centre-on-click" /> <span data-t="settings.centreOnClick"></span></label>
      <label><input type="checkbox" id="refit-on-change" /> <span data-t="settings.refitOnChange"></span></label>
      <label><input type="checkbox" id="show-pins" /> <span data-t="settings.showPins"></span></label>
      <label><input type="checkbox" id="open-new-commits" /> <span data-t="settings.openNewCommits"></span></label>
      <footer><button data-t="close" onclick="this.closest('dialog').close()"></button></footer>
    </dialog>

    <script type="module" src="/web/app.js"></script>
  </body>
</html>
