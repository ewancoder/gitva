<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gitva from a CDN</title>

<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0d0f13;
  }
  #graph {
    height: 100%;
  }
  nav {
    position: fixed;
    top: 12px;
    left: 12px;
    display: flex;
    gap: 8px;
    font:
      14px system-ui,
      sans-serif;
  }
  button {
    padding: 6px 12px;
    color: #dfe4ee;
    background: #171a21;
    border: 1px solid #2c313d;
    border-radius: 6px;
    cursor: pointer;
  }
</style>

<div id="graph"></div>
<nav>
  <button id="back">← back</button>
  <button id="next">next →</button>
</nav>

<script type="module">
  import { mount } from "https://esm.sh/gitva@1.5.1";

  const canvas = mount(graph);
  for (const step of JSON.parse(steps.textContent)) canvas.show(step);
  canvas.goto(0);

  back.onclick = () => canvas.step(-1);
  next.onclick = () => canvas.step(1);
</script>

<!--
  That is the whole page. Everything below is data, not code.

  A step is what git did: three commands, recorded off gitva's own event stream
  and pasted in. A page holding steps needs no git, no server and no route — the
  canvas draws whatever it is handed.

    git add hello.txt         a blob, and an index entry naming it
    git commit -m "hello"     a tree wrapping the blob, a commit naming the tree
    git commit -am "world"    a second of each; nothing was changed, only added
-->
