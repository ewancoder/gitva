name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For NPM OIDC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # Recommended for publishing workflows.
      - run: npm ci
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: gitva-tarball
          path: '*.tgz'
      # Make sure package.json has the correct version.
      - if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm publish
